<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- An app, not a web page: no zooming (double-tap, pinch, or into a text field), drawn edge to edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9ebdd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151a14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The page runs under the clock and battery (no white strip on top); main's top padding keeps text clear. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nekko" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Nekko</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
