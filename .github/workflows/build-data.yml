name: Build data

# Rebuilds data/ with example sentences (Tatoeba) and commits the result to the same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: sources
          key: sources-${{ hashFiles('scripts/fetch_sources.py') }}

      - name: Fetch sources
        run: python scripts/fetch_sources.py --sentences

      - name: Build data
        run: python scripts/build_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "Rebuild data"
            git push
          fi
