name: App

# Builds the app on every PR; on main it also publishes to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The recordings are served by the app itself (scripts/fetch_audio.mjs); the cache keeps them between runs.
      # The newest cache is restored, and a new one is saved whenever a run downloaded more. Downloads stop after
      # a few minutes so a deploy never waits long; the rest come on later runs.
      - uses: actions/cache/restore@v4
        with:
          path: public/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-
      - id: audio
        run: node scripts/fetch_audio.mjs
        env:
          AUDIO_MINUTES: 4
      - if: steps.audio.outputs.got != '0'
        uses: actions/cache/save@v4
        with:
          path: public/audio
          key: audio-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
